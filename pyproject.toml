[project]
name = "sentinel"
version = "0.1.0"
description = ""
authors = [
    {name = "Mallem Sofiane",email = "melsopv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "redis (>=8.0.1,<9.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "greenlet (>=3.5.3,<4.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "pwdlib (>=0.3.0,<0.4.0)"
]

[tool.poetry]
packages = [{include = "sentinel", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.15.21,<0.16.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "types-python-jose (>=3.5.0.20260408,<4.0.0.0)"
]
